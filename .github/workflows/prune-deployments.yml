name: Auto-Prune Vercel Deployments

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly safety run every Sunday at midnight UTC
    - cron: '0 0 * * 0'

jobs:
  prune:
    name: Prune Old Deployments (Keep 3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Give Vercel 90s to register the new deployment before pruning
      - name: Wait for Deployment Registration
        if: github.event_name == 'push'
        run: sleep 90

      - name: Prune Deployments (Keep Latest 3)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: subhajit-pradhans-projects
          VERCEL_PROJECT: cscosmos
          VERCEL_KEEP: 3
        run: node scripts/prune-vercel-deployments.mjs 3
